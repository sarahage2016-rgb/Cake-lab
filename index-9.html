<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Cake Lab</title>
</head>
<body style="margin:0;background:#f7ede4">
<script>
(async function(){
  const target='./CakeLab-index-FIX-SANS-SUPERPOSITION-v3.html?v=20261003-1438';
  try{
    const r=await fetch(target,{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const html=await r.text();
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    location.replace(target);
  }
})();
</script>
</body>
