<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cake Lab — Aperçu dynamique</title>
<style>
:root{--brown:#6b2b17;--brown2:#3f160b;--cream:#fffaf3;--line:#e7d4c5;--gold:#d09a3c;--muted:#7a6b63}
*{box-sizing:border-box}body{margin:0;background:#fbf4eb;color:#2d211d;font-family:Arial,sans-serif}.top{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,#7d3219,#4f1c0e);color:#fff;padding:16px}.brand{font-family:Georgia,serif;font-size:28px;font-weight:700;letter-spacing:.5px}.sub{font-size:11px;letter-spacing:3px;opacity:.85}.wrap{max-width:900px;margin:auto;padding:18px}.notice{background:#fff6da;border:1px solid #eedc9e;border-radius:14px;padding:12px 14px;margin-bottom:18px;font-size:14px}.hero{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;margin-bottom:22px;box-shadow:0 8px 30px #6b2b1710}.hero img{width:100%;height:260px;object-fit:cover;display:block}.hero .txt{padding:18px}.hero h1{font-family:Georgia,serif;margin:0 0 6px;font-size:30px}.price{font-size:26px;font-weight:800;color:var(--brown)}.tabs{display:flex;gap:8px;overflow:auto;margin:12px 0 18px}.tab{border:1px solid var(--line);background:white;border-radius:999px;padding:9px 14px;white-space:nowrap;font-weight:700}.tab.active{background:var(--brown);color:#fff;border-color:var(--brown)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:white;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 8px 24px #6b2b170d}.card img{width:100%;aspect-ratio:1.25/1;object-fit:cover;display:block;background:#f3e9df}.body{padding:13px}.name{font-family:Georgia,serif;font-size:20px;font-weight:700;margin-bottom:4px}.desc{font-size:13px;color:var(--muted);min-height:34px}.row{display:flex;justify-content:space-between;align-items:center;margin-top:10px}.badge{display:inline-block;background:#fff0d4;color:#8b5a00;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:700}.empty{padding:26px;text-align:center;background:#fff;border:1px dashed var(--line);border-radius:16px;color:var(--muted)}.status{font-size:12px;color:#5b4b44;margin-top:10px}.hidden{display:none!important}@media(max-width:560px){.wrap{padding:12px}.grid{gap:10px}.card{border-radius:15px}.hero img{height:210px}.name{font-size:17px}.desc{font-size:12px}.price{font-size:21px}}
</style></head><body>
<div class="top"><div class="brand">CAKE LAB ♡</div><div class="sub">APERÇU DYNAMIQUE</div></div>
<div class="wrap">
<div class="notice">Cette page lit Supabase en direct. Elle sert uniquement à vérifier l’administration. <b>Le site public actuel n’est pas modifié.</b></div>
<section id="month" class="hero hidden"></section>
<div class="tabs"><button class="tab active" data-cat="all">Tout</button><button class="tab" data-cat="cake">Cakes</button><button class="tab" data-cat="box">Box</button><button class="tab" data-cat="snack">Snacks & biscuits</button><button class="tab" data-cat="new">Nouveautés</button></div>
<div id="grid" class="grid"></div><div id="status" class="status"></div>
</div>
<script>
const SUPABASE_URL='https://mjcoidbfmzlqxvrnyayd.supabase.co';
const SUPABASE_KEY='sb_publishable_DcjUuH5aWrkAcXTw-02xZg_wZfd9wy3';
let products=[], current='all';
const fmt=n=>new Intl.NumberFormat('fr-FR').format(Number(n||0))+' F';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function imageOf(p){return p.image_url || p.image_path || ''}
async function load(){
 const r=await fetch(`${SUPABASE_URL}/rest/v1/products?select=*&active=eq.true&order=sort_order.asc`,{headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`}});
 if(!r.ok) throw new Error('Supabase '+r.status);
 products=await r.json(); render();
}
function render(){
 const month=products.find(p=>p.is_month);
 const m=document.getElementById('month');
 if(month){m.classList.remove('hidden');m.innerHTML=`${imageOf(month)?`<img src="${esc(imageOf(month))}" alt="${esc(month.name)}">`:''}<div class="txt"><span class="badge">Cake du mois</span><h1>${esc(month.name)}</h1><p>${esc(month.description||'')}</p><div class="price">${fmt(month.price)}</div></div>`}else m.classList.add('hidden');
 let arr=products.filter(p=>current==='all'||p.category===current||(current==='new'&&p.is_new));
 const g=document.getElementById('grid');
 if(!arr.length){g.innerHTML='<div class="empty" style="grid-column:1/-1">Aucun produit dans cette catégorie.</div>';return}
 g.innerHTML=arr.map(p=>`<article class="card">${imageOf(p)?`<img src="${esc(imageOf(p))}" alt="${esc(p.name)}">`:''}<div class="body"><div>${p.is_new?'<span class="badge">Nouveauté</span>':''}</div><div class="name">${esc(p.name)}</div><div class="desc">${esc(p.description||'')}</div><div class="row"><strong>${fmt(p.price)}</strong><small>${p.category==='cake'?'Cake':p.category==='box'?'Box':'Snack'}</small></div></div></article>`).join('');
 document.getElementById('status').textContent=`${products.length} produit(s) actifs chargés depuis Supabase.`;
}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');current=b.dataset.cat;render()});
load().catch(e=>{document.getElementById('grid').innerHTML=`<div class="empty" style="grid-column:1/-1">Erreur de connexion : ${esc(e.message)}</div>`});
</script></body></html>
